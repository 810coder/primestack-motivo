<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid & List Layout</title>
    <style>
        :root {
            --primary: #2c7be5;
            --border: #e6eef7;
            --text-muted: #6b7280;
            --bg-light: #f8fafc;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #111827;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Toggle buttons */
        .toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .toggle button {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Shared box */
        .box {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        /* GRID VIEW */
        .grid-view {
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 220px);
            gap: 24px;
        }

        .grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        /* LIST VIEW */
        .list-view {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 14px 10px;
            border-bottom: 1px solid var(--border);
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
        }

        tbody td {
            padding: 20px 10px;
            font-size: 15px;
        }

        tbody td.name {
            color: var(--primary);
            font-weight: 600;
        }

        /* visible state */
        .show {
            display: block;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Toggle -->
        <div class="toggle">
            <button id="listBtn" class="active">☰ List layout</button>
            <button id="gridBtn">▦ Grid layout</button>
        </div>

        <!-- LIST VIEW -->
        <div class="box list-view show" id="listView">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Project</th>
                        <th>Sector</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="name">Jon House</td>
                        <td>Home</td>
                        <td>Residential</td>
                    </tr>
                    <tr>
                        <td class="name">Carillion</td>
                        <td>Home</td>
                        <td>Residential</td>
                    </tr>
                    <tr>
                        <td class="name">Victoria House</td>
                        <td>Home</td>
                        <td>Residential</td>
                    </tr>
                    <tr>
                        <td class="name">Bimbo House</td>
                        <td>Home</td>
                        <td>Residential</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- GRID VIEW -->
        <div class="box grid-view" id="gridView">
            <div class="grid">
                <img src="https://picsum.photos/600/400?1" alt="project 1" />
                <img src="https://picsum.photos/600/400?2" alt="project 2" />
                <img src="https://picsum.photos/600/400?3" alt="project 3" />
                <img src="https://picsum.photos/600/400?4" alt="project 4" />
            </div>
        </div>

    </div>

    <script>
        const listBtn = document.getElementById('listBtn');
        const gridBtn = document.getElementById('gridBtn');
        const listView = document.getElementById('listView');
        const gridView = document.getElementById('gridView');

        listBtn.onclick = () => {
            listBtn.classList.add('active');
            gridBtn.classList.remove('active');
            listView.classList.add('show');
            gridView.classList.remove('show');
        };

        gridBtn.onclick = () => {
            gridBtn.classList.add('active');
            listBtn.classList.remove('active');
            gridView.classList.add('show');
            listView.classList.remove('show');
        };
    </script>

</body>

</html>
